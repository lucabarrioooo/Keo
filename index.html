<style>
  :root {
    --bg: #f2f2f7;
    --surface: #ffffff;
    --surface-2: #f2f2f7;
    --text: #1c1c1e;
    --text-secondary: #8e8e93;
    --text-tertiary: #c7c7cc;
    --separator: rgba(60, 60, 67, 0.12);
    --accent: #007aff;
    --green: #34c759;
    --orange: #ff9500;
    --red: #ff3b30;
    --indigo: #5856d6;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.06);
    --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --surface: #1c1c1e;
      --surface-2: #2c2c2e;
      --text: #ffffff;
      --text-secondary: #8e8e93;
      --text-tertiary: #48484a;
      --separator: rgba(84, 84, 88, 0.34);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  html, body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    letter-spacing: -0.011em; min-height: 100vh; overflow-x: hidden;
  }

  body {
    padding: max(20px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom));
    max-width: 480px; margin: 0 auto;
  }

  header { padding: 12px 4px 24px; position: relative; }

  .greeting {
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    margin-bottom: 4px; letter-spacing: -0.01em;
  }

  .title {
    font-size: 34px; font-weight: 700; letter-spacing: -0.025em; line-height: 1.05;
  }

  /* Sync indicator */
  .sync-indicator {
    position: absolute; top: 16px; right: 4px;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; color: var(--text-secondary); font-weight: 500;
    transition: opacity 0.3s ease; opacity: 0;
  }
  .sync-indicator.visible { opacity: 1; }
  .sync-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-tertiary);
  }
  .sync-indicator.syncing .sync-dot {
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .sync-indicator.error .sync-dot { background: var(--red); }
  .sync-indicator.ok .sync-dot { background: var(--green); }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  .hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.15) 35%,
      rgba(0,0,0,0.6) 75%, rgba(0,0,0,0.82) 100%);
  }
  .hero-content {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 18px 20px 20px; z-index: 2; color: white;
  }
  .hero-status-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 0.5px solid rgba(255, 255, 255, 0.3);
    padding: 6px 12px 6px 9px; border-radius: 100px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.02em; margin-bottom: 10px;
  }
  .hero-status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px currentColor;
  }
  .hero-status-pill.pending .hero-status-dot { background: #ffb340; }
  .hero-status-pill.alert .hero-status-dot { background: #ff6961; }
  .hero-title {
    font-size: 24px; font-weight: 700; letter-spacing: -0.025em;
    line-height: 1.1; margin-bottom: 4px; text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .hero-detail {
    font-size: 14px; color: rgba(255, 255, 255, 0.9);
    line-height: 1.4; text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  }

  .section-title {
    font-size: 13px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.05em; margin: 0 4px 10px;
  }

  .who-segment {
    display: flex; background: var(--surface); border-radius: 14px;
    padding: 4px; margin-bottom: 28px; box-shadow: var(--shadow-sm); gap: 2px;
  }
  .who-btn {
    flex: 1; background: transparent; border: none; padding: 10px 8px;
    border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600;
    color: var(--text-secondary); cursor: pointer;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); letter-spacing: -0.01em;
  }
  .who-btn.active {
    background: var(--accent); color: white;
    box-shadow: 0 2px 8px rgba(0, 122, 255, 0.25);
  }

  .meals { display: flex; flex-direction: column; gap: 14px; margin-bottom: 28px; }
  .meal {
    background: var(--surface); border-radius: 22px;
    padding: 22px 22px 18px; box-shadow: var(--shadow-sm);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .meal.done {
    background: linear-gradient(135deg, rgba(52, 199, 89, 0.08), rgba(52, 199, 89, 0.02));
  }
  .meal.busy { opacity: 0.6; pointer-events: none; }
  .meal-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .meal-info { display: flex; align-items: center; gap: 12px; }
  .meal-icon {
    width: 38px; height: 38px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); transition: all 0.3s ease;
  }
  .meal-icon svg { width: 20px; height: 20px; }
  .meal.done .meal-icon { background: var(--green); color: white; }
  .meal-icon.morning { color: var(--orange); }
  .meal-icon.evening { color: var(--indigo); }
  .meal-text { display: flex; flex-direction: column; gap: 2px; }
  .meal-name { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  .meal-status { font-size: 13px; color: var(--text-secondary); line-height: 1.3; }
  .meal.done .meal-status { color: var(--green); font-weight: 500; }
  .meal-check {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--surface-2); display: flex; align-items: center; justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); flex-shrink: 0;
  }
  .meal-check svg {
    width: 16px; height: 16px; color: var(--text-tertiary);
    transition: all 0.3s ease; transform: scale(0);
  }
  .meal.done .meal-check { background: var(--green); transform: scale(1.05); }
  .meal.done .meal-check svg { color: white; transform: scale(1); }
  .btn-feed {
    width: 100%; background: var(--accent); color: white; border: none;
    border-radius: 14px; padding: 14px; font-family: inherit;
    font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
    cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btn-feed:active { transform: scale(0.97); background: #0062cc; }
  .meal.done .btn-feed {
    background: transparent; color: var(--text-secondary);
    font-size: 13px; font-weight: 500; padding: 10px;
  }
  .meal.done .btn-feed:active { background: var(--surface-2); transform: scale(0.98); }

  .history-card {
    background: var(--surface); border-radius: 22px;
    overflow: hidden; box-shadow: var(--shadow-sm);
  }
  .history-empty { padding: 28px 22px; text-align: center; color: var(--text-secondary); font-size: 14px; }
  .history-item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border-bottom: 0.5px solid var(--separator);
  }
  .history-item:last-child { border-bottom: none; }
  .history-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .history-dot.morning { background: var(--orange); }
  .history-dot.evening { background: var(--indigo); }
  .history-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .history-line1 { font-size: 15px; font-weight: 500; letter-spacing: -0.01em; }
  .history-line2 { font-size: 12px; color: var(--text-secondary); }
  .history-time { font-size: 13px; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }

  .footer { margin-top: 24px; display: flex; justify-content: center; gap: 4px; }
  .footer-btn {
    background: transparent; border: none; color: var(--accent);
    font-family: inherit; font-size: 14px; font-weight: 500;
    cursor: pointer; padding: 10px 14px; border-radius: 10px; letter-spacing: -0.01em;
  }
  .footer-btn:active { background: var(--surface); }

  .toast {
    position: fixed; bottom: max(28px, env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%) translateY(120px);
    background: rgba(28, 28, 30, 0.92); color: white;
    padding: 12px 20px; border-radius: 100px;
    font-size: 14px; font-weight: 500; z-index: 100;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    letter-spacing: -0.01em;
  }
  @media (prefers-color-scheme: dark) {
    .toast { background: rgba(255, 255, 255, 0.92); color: #000; }
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 200; opacity: 0; transition: opacity 0.25s ease;
  }
  @media (min-width: 480px) {
    .modal-overlay { align-items: center; padding: 20px; }
  }
  .modal-overlay.show { display: flex; opacity: 1; }
  .modal {
    background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 28px 24px max(24px, env(safe-area-inset-bottom));
    width: 100%; max-width: 440px;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
  }
  @media (min-width: 480px) { .modal { border-radius: 24px; } }
  .modal-overlay.show .modal { transform: translateY(0); }
  .modal-handle {
    width: 36px; height: 5px; background: var(--text-tertiary);
    border-radius: 3px; margin: -16px auto 18px; opacity: 0.5;
  }
  @media (min-width: 480px) { .modal-handle { display: none; } }
  .modal-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
  .modal-text { font-size: 15px; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.45; }
  .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
  .modal-btn {
    flex: 1; padding: 14px; border-radius: 14px;
    font-family: inherit; font-size: 16px; font-weight: 600;
    cursor: pointer; border: none;
    background: var(--surface-2); color: var(--text);
    letter-spacing: -0.01em; transition: all 0.2s;
  }
  .modal-btn:active { transform: scale(0.97); }
  .modal-btn.danger { background: var(--red); color: white; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hero, .meal, .history-card, .who-segment {
    animation: fadeUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) backwards;
  }
  .hero { animation-delay: 0.05s; animation-duration: 0.7s; }
  .who-segment { animation-delay: 0.15s; }
  .meals .meal:nth-child(1) { animation-delay: 0.2s; }
  .meals .meal:nth-child(2) { animation-delay: 0.25s; }
  .history-card { animation-delay: 0.3s; }
</style>
</head>
<body>

<header>
  <div class="greeting" id="greeting">—</div>
  <h1 class="title">Keo</h1>
  <div class="sync-indicator" id="syncIndicator">
    <span class="sync-dot"></span>
    <span id="syncText">Sincronizando…</span>
  </div>
</header>

<div class="hero">
  <div class="hero-content">
    <div class="hero-status-pill" id="heroPill">
      <span class="hero-status-dot"></span>
      <span id="heroPillText">Hoy</span>
    </div>
    <div class="hero-title" id="heroTitle">Cargando…</div>
    <div class="hero-detail" id="heroDetail"></div>
  </div>
</div>

<div class="section-title">Quién soy</div>
<div class="who-segment" id="whoButtons"></div>

<div class="meals">
  <div class="meal" id="card-manana">
    <div class="meal-top">
      <div class="meal-info">
        <div class="meal-icon morning">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
        </div>
        <div class="meal-text">
          <div class="meal-name">Mañana</div>
          <div class="meal-status" id="status-manana">Aún no comió</div>
        </div>
      </div>
      <div class="meal-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
    </div>
    <button class="btn-feed" data-meal="manana">Marcar como dado</button>
  </div>

  <div class="meal" id="card-noche">
    <div class="meal-top">
      <div class="meal-info">
        <div class="meal-icon evening">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </div>
        <div class="meal-text">
          <div class="meal-name">Noche</div>
          <div class="meal-status" id="status-noche">Aún no comió</div>
        </div>
      </div>
      <div class="meal-check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
    </div>
    <button class="btn-feed" data-meal="noche">Marcar como dado</button>
  </div>
</div>

<div class="section-title">Últimos registros</div>
<div class="history-card" id="historyCard">
  <div class="history-empty">Cargando registros…</div>
</div>

<div class="footer">
  <button class="footer-btn" id="btnRefresh">Actualizar</button>
  <button class="footer-btn" id="btnReset">Reiniciar día</button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalUndo">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Desmarcar comida</div>
    <div class="modal-text" id="modalUndoText"></div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal('modalUndo')">Cancelar</button>
      <button class="modal-btn danger" id="btnUndoConfirm">Desmarcar</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalReset">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">¿Reiniciar el día?</div>
    <div class="modal-text">Se borrarán los registros de hoy. Esta acción no se puede deshacer.</div>
    <div class="modal-actions">
      <button class="modal-btn" onclick="closeModal('modalReset')">Cancelar</button>
      <button class="modal-btn danger" id="btnResetConfirm">Reiniciar</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbw-q4h9ANOU7ukbVHyt0sOE0zchup2YX9c383BoAtwHB_cYxOJ7ptCK_DilVgArPSoy0Q/exec';
const NAMES = ['Luca', 'Joaco', 'Toty'];
const WHO_KEY = 'keo-current-user-v2';
const CACHE_KEY = 'keo-records-cache-v2';

let state = {
  currentUser: null,
  records: [],
  lastSync: 0,
  isBusy: { manana: false, noche: false }
};

// ==================== API ====================
async function apiGet() {
  const url = API_URL + '?t=' + Date.now();
  const res = await fetch(url, { method: 'GET', redirect: 'follow' });
  if (!res.ok) throw new Error('Network error');
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'API error');
  return data.records || [];
}

async function apiPost(body) {
  // text/plain evita el preflight CORS de Apps Script
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(body),
    redirect: 'follow'
  });
  if (!res.ok) throw new Error('Network error');
  const data = await res.json();
  if (!data.ok) throw new Error(data.error || 'API error');
  return data;
}

// ==================== STORAGE LOCAL ====================
function loadLocal() {
  try {
    const who = localStorage.getItem(WHO_KEY);
    if (who && NAMES.includes(who)) state.currentUser = who;
  } catch (e) {}
  try {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) state.records = JSON.parse(cached);
  } catch (e) {}
}

function saveWho() {
  try { if (state.currentUser) localStorage.setItem(WHO_KEY, state.currentUser); }
  catch (e) {}
}

function saveCache() {
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(state.records)); }
  catch (e) {}
}

// ==================== SYNC ====================
async function syncFromServer(silent = false) {
  if (!silent) setSyncStatus('syncing', 'Sincronizando…');
  try {
    const records = await apiGet();
    state.records = records;
    state.lastSync = Date.now();
    saveCache();
    renderAll();
    setSyncStatus('ok', 'Actualizado');
    setTimeout(() => setSyncStatus('hidden'), 1500);
    return true;
  } catch (err) {
    console.error('Sync error:', err);
    setSyncStatus('error', 'Sin conexión');
    return false;
  }
}

function setSyncStatus(status, text) {
  const ind = document.getElementById('syncIndicator');
  const txt = document.getElementById('syncText');
  ind.classList.remove('syncing', 'ok', 'error', 'visible');
  if (status === 'hidden') return;
  ind.classList.add('visible', status);
  if (text) txt.textContent = text;
}

// ==================== HELPERS ====================
function getDateKey(date = new Date()) {
  return date.getFullYear() + '-' +
    String(date.getMonth()+1).padStart(2,'0') + '-' +
    String(date.getDate()).padStart(2,'0');
}

function formatTime(ts) {
  return new Date(Number(ts)).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
}

function getGreeting() {
  const h = new Date().getHours();
  if (h < 6) return 'Madrugada';
  if (h < 12) return 'Buenos días';
  if (h < 19) return 'Buenas tardes';
  return 'Buenas noches';
}

function todayRecords() {
  const today = getDateKey();
  return state.records.filter(r => r.dateKey === today);
}

function getMealRecord(meal) {
  return todayRecords().find(r => r.meal === meal);
}

// ==================== RENDER ====================
function renderGreeting() {
  document.getElementById('greeting').textContent = getGreeting();
}

function renderWhoButtons() {
  const container = document.getElementById('whoButtons');
  container.innerHTML = '';
  NAMES.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'who-btn' + (name === state.currentUser ? ' active' : '');
    btn.textContent = name;
    btn.onclick = () => {
      state.currentUser = name;
      saveWho();
      renderWhoButtons();
    };
    container.appendChild(btn);
  });
}

function renderMeal(meal) {
  const card = document.getElementById('card-' + meal);
  const status = document.getElementById('status-' + meal);
  const btn = card.querySelector('.btn-feed');
  const record = getMealRecord(meal);

  card.classList.toggle('busy', state.isBusy[meal]);

  if (record) {
    card.classList.add('done');
    status.textContent = record.who + ' · ' + formatTime(record.timestamp);
    btn.textContent = 'Tocar para deshacer';
  } else {
    card.classList.remove('done');
    status.textContent = 'Aún no comió';
    btn.textContent = 'Marcar como dado';
  }
}

function renderHero() {
  const today = todayRecords();
  const title = document.getElementById('heroTitle');
  const detail = document.getElementById('heroDetail');
  const pill = document.getElementById('heroPill');
  const pillText = document.getElementById('heroPillText');
  const hour = new Date().getHours();

  pill.classList.remove('pending', 'alert');

  if (today.length >= 2) {
    title.textContent = 'Todo listo';
    detail.textContent = 'Keo ya comió las dos veces de hoy';
    pillText.textContent = 'Al día';
  } else if (today.length === 1) {
    const falta = today[0].meal === 'manana' ? 'la cena' : 'el desayuno';
    title.textContent = 'Falta ' + falta;
    detail.textContent = today[0].who + ' le dio de comer a las ' + formatTime(today[0].timestamp);
    pill.classList.add('pending');
    pillText.textContent = 'Pendiente';
  } else {
    title.textContent = 'Sin comidas aún';
    detail.textContent = hour >= 11 ? 'Ya es tarde para el desayuno' : 'Esperando el desayuno';
    pill.classList.add(hour >= 11 ? 'alert' : 'pending');
    pillText.textContent = hour >= 11 ? 'Atrasado' : 'Pendiente';
  }
}

function renderHistory() {
  const card = document.getElementById('historyCard');
  const recent = [...state.records].sort((a,b) => b.timestamp - a.timestamp).slice(0, 6);

  if (recent.length === 0) {
    card.innerHTML = '<div class="history-empty">Todavía no hay registros</div>';
    return;
  }

  const today = getDateKey();
  const yesterday = getDateKey(new Date(Date.now() - 86400000));

  card.innerHTML = recent.map(r => {
    let dayLabel;
    if (r.dateKey === today) dayLabel = 'Hoy';
    else if (r.dateKey === yesterday) dayLabel = 'Ayer';
    else dayLabel = new Date(Number(r.timestamp)).toLocaleDateString('es-AR', { day:'2-digit', month:'short' });

    const dotClass = r.meal === 'manana' ? 'morning' : 'evening';
    const mealLabel = r.meal === 'manana' ? 'Mañana' : 'Noche';

    return '<div class="history-item">' +
      '<div class="history-dot ' + dotClass + '"></div>' +
      '<div class="history-main">' +
        '<div class="history-line1">' + mealLabel + ' · ' + r.who + '</div>' +
        '<div class="history-line2">' + dayLabel + '</div>' +
      '</div>' +
      '<div class="history-time">' + formatTime(r.timestamp) + '</div>' +
    '</div>';
  }).join('');
}

function renderAll() {
  renderGreeting();
  renderWhoButtons();
  renderMeal('manana');
  renderMeal('noche');
  renderHero();
  renderHistory();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function openModal(id) { document.getElementById(id).classList.add('show'); }
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// ==================== ACTIONS ====================
async function markMeal(meal) {
  if (!state.currentUser) {
    showToast('Primero seleccioná quién sos');
    return;
  }
  if (state.isBusy[meal]) return;

  // Sincronizar primero para evitar duplicados (si otra persona ya marcó)
  state.isBusy[meal] = true;
  renderMeal(meal);
  setSyncStatus('syncing', 'Verificando…');

  const ok = await syncFromServer(true);
  if (!ok) {
    state.isBusy[meal] = false;
    renderMeal(meal);
    showToast('Sin conexión. Probá de nuevo.');
    return;
  }

  const existing = getMealRecord(meal);

  if (existing) {
    state.isBusy[meal] = false;
    renderMeal(meal);
    setSyncStatus('hidden');
    document.getElementById('modalUndoText').textContent =
      existing.who + ' marcó la comida de ' + (meal === 'manana' ? 'la mañana' : 'la noche') + ' a las ' + formatTime(existing.timestamp) + '.';
    document.getElementById('btnUndoConfirm').onclick = async () => {
      closeModal('modalUndo');
      state.isBusy[meal] = true;
      renderMeal(meal);
      setSyncStatus('syncing', 'Borrando…');
      try {
        await apiPost({
          action: 'delete',
          timestamp: existing.timestamp,
          meal: existing.meal,
          who: existing.who
        });
        await syncFromServer(true);
        showToast('Desmarcado');
      } catch (err) {
        showToast('Error al desmarcar');
        setSyncStatus('error', 'Error');
      } finally {
        state.isBusy[meal] = false;
        renderMeal(meal);
      }
    };
    openModal('modalUndo');
    return;
  }

  // Crear registro
  const record = {
    action: 'add',
    timestamp: Date.now(),
    dateKey: getDateKey(),
    meal: meal,
    who: state.currentUser
  };

  setSyncStatus('syncing', 'Guardando…');
  try {
    await apiPost(record);
    // Optimistic update local + resync
    state.records.push({
      timestamp: record.timestamp,
      dateKey: record.dateKey,
      meal: record.meal,
      who: record.who
    });
    saveCache();
    renderAll();
    if (navigator.vibrate) navigator.vibrate(10);
    showToast((meal === 'manana' ? 'Mañana' : 'Noche') + ' registrada');
    setSyncStatus('ok', 'Guardado');
    setTimeout(() => setSyncStatus('hidden'), 1500);
  } catch (err) {
    showToast('Error al guardar');
    setSyncStatus('error', 'Error');
  } finally {
    state.isBusy[meal] = false;
    renderMeal(meal);
  }
}

document.querySelectorAll('.btn-feed').forEach(btn => {
  btn.addEventListener('click', () => markMeal(btn.dataset.meal));
});

document.getElementById('btnRefresh').onclick = () => syncFromServer();

document.getElementById('btnReset').onclick = () => openModal('modalReset');

document.getElementById('btnResetConfirm').onclick = async () => {
  closeModal('modalReset');
  setSyncStatus('syncing', 'Reiniciando…');
  try {
    await apiPost({ action: 'resetDay', dateKey: getDateKey() });
    await syncFromServer(true);
    showToast('Día reiniciado');
  } catch (err) {
    showToast('Error al reiniciar');
    setSyncStatus('error', 'Error');
  }
};

document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) overlay.classList.remove('show');
  });
});

// Auto-refresh cada 30 segundos cuando la pestaña está visible
setInterval(() => {
  if (!document.hidden) syncFromServer(true);
}, 30000);

// Refrescar cuando el usuario vuelve a la app
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) syncFromServer(true);
});

// Re-render del reloj cada minuto
setInterval(renderGreeting, 60000);

// Init
loadLocal();
renderAll();
syncFromServer();
</script>
</body>
</html>
